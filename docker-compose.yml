# AttendOps: run the app on this computer. Use install.ps1 (Windows) or install.sh (macOS/Linux),
# which create .env and start this stack. Both containers restart automatically (e.g. after a reboot,
# once Docker is running).
name: attendops

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-attendops}
      POSTGRES_USER: ${POSTGRES_USER:-attendops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20
    networks: [internal]

  app:
    build: .
    image: attendops:local
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-attendops}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-attendops}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      DEVICE_CREDENTIALS_KEY: ${DEVICE_CREDENTIALS_KEY:?set DEVICE_CREDENTIALS_KEY in .env}
      ENVIRONMENT: production
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Beirut}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
      DEVICE_CONNECT_TIMEOUT: ${DEVICE_CONNECT_TIMEOUT:-3}
      DEVICE_READ_TIMEOUT: ${DEVICE_READ_TIMEOUT:-10}
      DEVICE_MAX_CONCURRENCY: ${DEVICE_MAX_CONCURRENCY:-4}
      SYNC_INITIAL_DAYS: ${SYNC_INITIAL_DAYS:-30}
      SYNC_OVERLAP_MINUTES: ${SYNC_OVERLAP_MINUTES:-60}
      SYNC_CHUNK_HOURS: ${SYNC_CHUNK_HOURS:-24}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # 127.0.0.1 = only this computer. Set APP_BIND=0.0.0.0 in .env to let other computers on the LAN in.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8000"
    networks: [internal]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

networks:
  internal:
    # Pinned so Docker never picks 172.22.x / 172.23.x, which would hide the access-control devices
    # (Docker's default pools are 172.17-172.31.x). Change DOCKER_SUBNET only if it clashes with your LAN.
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-10.254.254.0/24}

volumes:
  pgdata:
