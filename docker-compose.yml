# Local development stack. Copy .env.example to .env and fill in the secrets first.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-attendops}
      POSTGRES_USER: ${POSTGRES_USER:-attendops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # host access for local tools only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-attendops}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-attendops}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      DEVICE_CREDENTIALS_KEY: ${DEVICE_CREDENTIALS_KEY:?set DEVICE_CREDENTIALS_KEY in .env}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Beirut}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pgdata:
